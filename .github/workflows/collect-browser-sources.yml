# Nightly run for sources that need a real browser (method "playwright").
# Vercel Cron handles every other method. Add these repository secrets:
# NEXT_PUBLIC_SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY, ANTHROPIC_API_KEY, CONTACT_EMAIL.
name: Collect browser sources

on:
  schedule:
    - cron: "43 10 * * *" # ~3:45am in San Francisco
  workflow_dispatch:
    inputs:
      source:
        description: "Run just this source slug (optional)"
        required: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright-core install --with-deps chromium
      - name: Collect
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CONTACT_EMAIL: ${{ secrets.CONTACT_EMAIL }}
        run: |
          if [ -n "${{ github.event.inputs.source }}" ]; then
            npm run collect -- --source "${{ github.event.inputs.source }}"
          else
            npm run collect -- --due --method playwright
          fi
